name: QA
on:
  push:
    paths-ignore:
      - .github/workflows/engine-diagnostics.yml
      - qa/engine-capture.mjs
      - qa/scale-diagnostic.mjs
      - qa/REPORT.md
      - qa/ci-results/**
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install-deps
      - run: npm run check
      - run: npm run qa:setup && npm run qa -- --project=${{ matrix.browser }}
      - uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const file = 'test-results/results.json';
            const lines = [];
            if (fs.existsSync(file)) {
              const report = JSON.parse(fs.readFileSync(file, 'utf8'));
              const visit = suite => {
                for (const spec of suite.specs || []) for (const test of spec.tests || []) {
                  const result = test.results?.at(-1);
                  lines.push(`${result?.status || 'not_run'} | ${spec.title} | ${(result?.error?.message || '').replace(/\u001b\[[0-9;]*m/g, '').replace(/\s+/g, ' ').slice(0, 150)}`);
                }
                for (const child of suite.suites || []) visit(child);
              };
              for (const suite of report.suites || []) visit(suite);
            } else lines.push('not_run | results.json missing');
            const bad = lines.some(line => !line.startsWith('passed |') && !line.startsWith('skipped |'));
            await github.rest.checks.create({owner:context.repo.owner,repo:context.repo.repo,head_sha:context.sha,name:'QA details - ${{ matrix.browser }}',status:'completed',conclusion:bad?'failure':'success',output:{title:`${lines.length} cases`,summary:lines.join('\n').slice(0,65000)}});
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-results-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
